<!DOCTYPE html>
<html>
  <head>
    <title>Mars Landing AI</title>
  </head>

  <body>
    <h2>Mars Landing Site Detector</h2>

    <input id="x1" placeholder="x1" />
    <input id="y1" placeholder="y1" />

    <input id="x2" placeholder="x2" />
    <input id="y2" placeholder="y2" />

    <button onclick="getLanding()">Find Landing Site</button>

    <p id="result"></p>

    <script>
      async function getLanding() {
        let data = {
          x1: parseInt(document.getElementById('x1').value),
          y1: parseInt(document.getElementById('y1').value),
          x2: parseInt(document.getElementById('x2').value),
          y2: parseInt(document.getElementById('y2').value)
        }
      
        let response = await fetch('http://localhost:5000/landing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
      
        let result = await response.json()
      
        document.getElementById('result').innerText = 'Best Landing Coordinate: ' + result.landing_x + ' , ' + result.landing_y
      }
    </script>
  </body>
</html>
